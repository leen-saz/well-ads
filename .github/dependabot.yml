version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # TypeScript stays on 6 until both @astrojs/check (peer ^5 || ^6) and typescript-eslint (peer <6.1) accept 7;
    # with 7 `npm ci` fails with ERESOLVE (PR #3). Re-check: npm view @astrojs/check peerDependencies
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
