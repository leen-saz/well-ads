name: parity

# Phase 4.1 (docs/phase-4.md): the dashboard numbers must match tests/parity/golden.json.
on:
  pull_request:
    paths:
      - pipeline/template.html
      - pipeline/dash/**
      - pipeline/dash_template.py
      - pipeline/build.py
      - public/assets/**
      - src/pages/**
      - tests/parity/**
      - playwright.config.ts
      - package-lock.json
      - .github/workflows/parity.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:parity
      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-results
          path: test-results/
          retention-days: 7
