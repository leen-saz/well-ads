# Which social-listening sources answer from Cloudflare's servers (Actions > listening-probe > Run workflow).
# Calls staging's GET /api/listening/probe: a sample watch with the free sources, and each news source alone,
# and prints the count or the refusal per source. Reads only. Sends the repository secret LISTENING_PROBE_SECRET
# (the same value as the staging Worker's PROBE_SECRET) in the x-probe-secret header; without it the endpoint answers 401.
name: listening-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ask staging's Worker
        env:
          URL: https://well-ads-staging.leen-b9b.workers.dev/api/listening/probe
          PROBE_SECRET: ${{ secrets.LISTENING_PROBE_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$PROBE_SECRET" ] || { echo "::error::add the repository secret LISTENING_PROBE_SECRET (docs/secrets/worker.env.example)"; exit 1; }
          body="$(curl -fsS --max-time 60 -H "x-probe-secret: $PROBE_SECRET" "$URL")"
          echo "$body" | jq .
          {
            echo "### Listening sources from Cloudflare"
            echo '```json'
            echo "$body" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
