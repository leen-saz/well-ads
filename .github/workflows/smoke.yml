name: smoke

# End-to-end smoke tests (tests/smoke, docs/smoke-tests.md): the built Worker runs locally with a fake Supabase and
# synthetic users. Needs no secrets. Also callable from other workflows (the deploy workflow runs it before deploying).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: test-results/
          retention-days: 7
