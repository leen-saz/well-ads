name: deploy

# Staging: automatic on every push to main, after CI passes.
# Production: manual only (Actions > deploy > Run workflow > production), after CI passes, through the
# `production` environment that only accepts main (ADR-0005).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging or production"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    # Same gates as ci.yml (kept identical)
    uses: leen-saz/eng-policies/.github/workflows/ci.yml@d833f62b55b60f1421f6813ca0a7fd678470c3c6
    with:
      # Astro needs Node >= 22.23.4; the runner's Node 22 resolved to 22.23.3
      node-version: "24"
      install-command: "npm ci"
      lint-command: "npm run lint"
      typecheck-command: "npm run typecheck"
      unit-command: "npm run test:unit"
      integration-command: "npm run test:integration"
      build-command: "npm run build"
      audit-command: "npm audit --audit-level=high"
      # Python pipeline (phase 3), copied as-is from the old repo. Lint is correctness-only until phase 8.
      python-version: "3.12"
      python-requirements: pipeline/requirements.txt
      python-lint-command: "ruff check --isolated --select E9,F63,F7,F82 pipeline supabase"
      python-test-command: "cd pipeline && python -m unittest discover -s tests -p 'test_*.py' && python -m unittest discover -s modules -t ."
      # Supabase migrations applied in order to a throwaway Postgres
      db-engine: postgres
      migrations-dir: supabase/migrations

  # The end-to-end smoke tests (tests/smoke) run on this exact commit before anything is deployed
  smoke:
    uses: ./.github/workflows/smoke.yml

  deploy:
    needs: [ci, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Cloudflare account check
        run: npx wrangler whoami
      - name: workers.dev subdomain of the account
        id: sub
        run: |
          set -euo pipefail
          res="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          ok="$(jq -r '.success' <<<"$res")"; sub="$(jq -r '.result.subdomain // empty' <<<"$res")"
          if [ "$ok" != "true" ] || [ -z "$sub" ]; then
            echo "::error title=workers.dev::No workers.dev subdomain readable for this account. API errors: $(jq -c '.errors' <<<"$res")"
            exit 1
          fi
          echo "::notice title=workers.dev::subdomain is $sub"
          echo "sub=$sub" >> "$GITHUB_OUTPUT"
      - name: Ensure the R2 bucket of this environment exists
        run: |
          bucket="well-ads-files"; [ "$TARGET" = staging ] && bucket="well-ads-files-staging"
          if npx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then echo "$bucket exists"
          else npx wrangler r2 bucket create "$bucket"; fi
      - name: Build for ${{ env.TARGET }}
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
        run: npm run build
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
        run: |
          # BUILD_VERSION = the commit; /api/health reports it so the check below knows this deploy is the one answering
          npx wrangler deploy --var BUILD_VERSION:"$GITHUB_SHA" --message "deploy ${GITHUB_SHA::7}"
          if [ "$TARGET" = staging ]; then
            url="https://well-ads-staging.${{ steps.sub.outputs.sub }}.workers.dev"
          else
            # Production has no workers.dev address; the Pages project in proxy/ is its public link.
            # The Astro build's redirect file is only for the Worker deploy; Pages must read proxy/wrangler.jsonc.
            rm -f .wrangler/deploy/config.json
            npx wrangler pages project list | grep -qw well-ads || npx wrangler pages project create well-ads --production-branch main
            (cd proxy && npx wrangler pages deploy --branch main --commit-dirty=true)
            res="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/well-ads")"
            url="https://$(jq -r '.result.subdomain' <<<"$res")"
          fi
          echo "::notice title=deployed::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check of the deployed version
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Up to ~2 minutes: a new version takes a moment to reach every edge. Must answer 200 with THIS commit's version.
          code=0; body=""
          for i in $(seq 1 24); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL/api/health" || echo 000)"
            body="$(cat /tmp/health.json 2>/dev/null || true)"
            [ "$code" = 200 ] && [ "$(jq -r '.version // empty' <<<"$body" 2>/dev/null)" = "$GITHUB_SHA" ] && break
            sleep 5
          done
          echo "health ($code): $(jq -c . <<<"$body" 2>/dev/null || echo "$body")"
          if [ "$code" != 200 ] || [ "$(jq -r '.version // empty' <<<"$body" 2>/dev/null)" != "$GITHUB_SHA" ]; then
            echo "::error title=health::$URL/api/health did not answer 200 with version $GITHUB_SHA (got $code). Roll back: docs/runbook.md"
            exit 1
          fi
          # A dependency that does not answer means a wrong secret or binding: the site is up but broken
          if [ "$(jq -r '.ok' <<<"$body")" != true ]; then
            echo "::error title=health::a dependency is down: $(jq -c .checks <<<"$body"). Roll back: docs/runbook.md"
            exit 1
          fi
      - name: Headers
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl -fsSI "$URL/robots.txt" | grep -i "^x-robots-tag: noindex"
