name: deploy

# Staging: automatic on every push to main, after CI passes.
# Production: manual only (Actions > deploy > Run workflow > production), after CI passes, through the
# `production` environment that only accepts main (ADR-0005).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging or production"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: leen-saz/eng-policies/.github/workflows/ci.yml@79ca6e387c145aa5efba25fc7818b9532dba6a7d
    with:
      install-command: "npm ci"
      lint-command: "npm run lint"
      typecheck-command: "npm run typecheck"
      unit-command: "npm run test:unit"
      integration-command: "npm run test:integration"
      build-command: "npm run build"
      audit-command: "npm audit --audit-level=high"

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cloudflare account check
        run: npx wrangler whoami
      - name: workers.dev subdomain of the account
        id: sub
        run: |
          set -euo pipefail
          res="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          ok="$(jq -r '.success' <<<"$res")"; sub="$(jq -r '.result.subdomain // empty' <<<"$res")"
          if [ "$ok" != "true" ] || [ -z "$sub" ]; then
            echo "::error title=workers.dev::No workers.dev subdomain readable for this account. API errors: $(jq -c '.errors' <<<"$res")"
            exit 1
          fi
          echo "::notice title=workers.dev::subdomain is $sub"
          echo "sub=$sub" >> "$GITHUB_OUTPUT"
      - name: Ensure the R2 bucket of this environment exists
        run: |
          bucket="well-ads-files"; [ "$TARGET" = staging ] && bucket="well-ads-files-staging"
          if npx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then echo "$bucket exists"
          else npx wrangler r2 bucket create "$bucket"; fi
      - name: Build for ${{ env.TARGET }}
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
        run: npm run build
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
        run: |
          npx wrangler deploy
          name="well-ads"; [ "$TARGET" = staging ] && name="well-ads-staging"
          url="https://$name.${{ steps.sub.outputs.sub }}.workers.dev"
          echo "::notice title=deployed::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5; do
            body="$(curl -fsS "$URL/api/health" || true)"; [ "$body" = '{"ok":true}' ] && break; sleep 5
          done
          [ "$body" = '{"ok":true}' ] || { echo "::error title=smoke::health check failed at $URL: $body"; exit 1; }
          curl -fsSI "$URL/robots.txt" | grep -i "^x-robots-tag: noindex"
