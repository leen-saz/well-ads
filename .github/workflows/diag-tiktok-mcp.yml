name: diag-tiktok-mcp
# Temporary: how the TikTok for Business MCP endpoint authenticates (no secrets used). Delete after use.
on:
  push:
    branches: ['diag/tiktok-mcp']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"probe","version":"0"}}}'
          for u in https://business-api.tiktok.com/open_mcp/tt-ads-mcp-flat; do
            echo "== POST $u"; curl -sS -m 20 -D - -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' --data "$init" "$u" | head -c 1500; echo
          done
          for u in https://business-api.tiktok.com/.well-known/oauth-authorization-server/open_mcp/tt-ads-mcp-flat/oauth https://business-api.tiktok.com/open_mcp/tt-ads-mcp-flat/oauth/.well-known/oauth-authorization-server https://business-api.tiktok.com/.well-known/openid-configuration/open_mcp/tt-ads-mcp-flat/oauth; do
            echo "== GET $u"; curl -sS -m 20 "$u" | head -c 2500; echo
          done
