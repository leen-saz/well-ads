# Deploys the Apipeline sites (leen-saz/pipeline, public): the board site and Apipeline Security, to the same Cloudflare account, reusing this repo's
# Cloudflare credentials (approved by Leen). Runs on push to this ops branch only.
name: deploy-apipeline
on:
  push:
    branches: [ops/deploy-apipeline]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { repository: leen-saz/pipeline, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { CLOUDFLARE_ENV: production }
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build:security
        env: { CLOUDFLARE_ENV: security }
      - run: npx wrangler deploy --env security
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
