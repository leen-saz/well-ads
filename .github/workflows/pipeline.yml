name: pipeline

# Hourly read-only export of data.json, the covers and the built dashboards from Supabase to R2, for staging
# and production (each its own GitHub environment and bucket). The old site's refresh-and-deploy (minute 7)
# stays the only writer to Supabase until cutover, so this runs at minute 37 and only reads.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            bucket: well-ads-files-staging
          - target: production
            bucket: well-ads-files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ matrix.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ${{ matrix.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Export data.json from Supabase (read-only)
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python export_data.py
      # Phase 4.1: the same pages the live site serves (build.py), so staging shows identical numbers
      - name: Build the dashboards (build.py)
        working-directory: pipeline
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check -q "Pillow==11.3.0"
          python build.py
          jq -r '.headers[0].headers[] | select(.key == "Content-Security-Policy") | .value' web/vercel.json > web/csp.txt
          test -s web/csp.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Cover names are content hashes, so a name already listed in thumbs/index.txt never changes.
      # Only new covers are uploaded, before data.json, so every cover it references exists.
      - name: Upload new covers to R2
        run: |
          set -euo pipefail
          npx wrangler r2 object get "$BUCKET/thumbs/index.txt" --file prev.txt --remote >/dev/null 2>&1 || : > prev.txt
          ls pipeline/thumbs > now.txt
          new=0
          while read -r f; do
            case "$f" in *.jpg) t=image/jpeg ;; *.png) t=image/png ;; *.webp) t=image/webp ;; *.gif) t=image/gif ;; *) continue ;; esac
            npx wrangler r2 object put "$BUCKET/thumbs/$f" --file "pipeline/thumbs/$f" --content-type "$t" --remote >/dev/null
            new=$((new + 1))
          done < <(sort now.txt | comm -13 <(sort prev.txt) -)
          sort -u prev.txt now.txt > index.txt
          npx wrangler r2 object put "$BUCKET/thumbs/index.txt" --file index.txt --content-type text/plain --remote >/dev/null
          echo "::notice title=covers::$new new, $(wc -l < now.txt) in use"
      - name: Upload the dashboards to R2
        working-directory: pipeline/web
        run: |
          set -euo pipefail
          put() { npx wrangler r2 object put "$BUCKET/site/$1" --file "$2" --content-type "$3" --remote >/dev/null; }
          put csp.txt csp.txt "text/plain; charset=utf-8"
          put control/ads.json public/control/ads.json "application/json"
          for f in public/c/index.html public/dept/*/index.html public/index.html; do
            put "${f#public/}" "$f" "text/html; charset=utf-8"
          done
          echo "::notice title=dashboards::$(find public -name index.html | wc -l) pages uploaded"
      - name: Upload data.json to R2
        run: |
          npx wrangler r2 object put "$BUCKET/data.json" --file pipeline/data.json \
            --content-type application/json --remote
          echo "::notice title=pipeline::data.json uploaded to $BUCKET"
