# Monthly restore test of the latest encrypted backup (docs/runbook.md → Backups). It downloads latest.enc from the private
# bucket, decrypts it with the same passphrase a person would need in an emergency, and runs supabase/backup_check.py:
# manifest fresh, every table file present and equal to its manifest, core tables not empty, migrations included.
# A red run means the backup cannot be trusted: fix it the same day. The log carries table names only, never rows.
# Started by the production Worker's Cron Trigger (src/lib/cron.ts), like db-backup.yml; the schedule is a second path.
name: db-restore-test

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 1 * *" # the 1st of each month, 06:47 Riyadh (after the weekly backup window, like the Worker trigger at 03 UTC)

permissions:
  contents: read

concurrency:
  group: db-restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: well-ads-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Download, decrypt and check the latest backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set"; exit 1; }
          npx wrangler r2 object get "$BACKUP_BUCKET/latest.enc" --file backup.enc --remote >/dev/null
          mkdir restore
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE -in backup.enc | tar xz -C restore
          python3 supabase/backup_check.py restore/backup
          rm -rf restore backup.enc
